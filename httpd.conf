ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.module
LoadModule authn_core_module modules/mod_authn_core.module
LoadModule authz_core_module modules/mod_authz_core.module
LoadModule unixd_module modules/mod_unixd.module
LoadModule dir_module modules/mod_dir.module
LoadModule lbmethod_bybusyness_module modules/mod_lbmethod_bybusyness.module
LoadModule proxy_module modules/mod_proxy.module
LoadModule proxy_http_module modules/mod_proxy_http.module
LoadModule log_config_module modules/mod_log_config.module
LoadModule mime_module modules/mod_mime.module

User daemon
Group daemon

ServerAdmin you@example.com

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

ErrorLog /proc/self/fd/2
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common
</IfModule>

ProxyPreserveHost On
ProxyPass / http://flask:5000/
ProxyPassReverse / http://flask:5000/
